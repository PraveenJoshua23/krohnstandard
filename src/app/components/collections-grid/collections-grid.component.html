<section class="collections" id="collection">
  <div class="collections__header" appScrollReveal>
    <div>
      <div class="collections__label">Our Collections</div>
      <h2 class="collections__title">The Three<br>Standards</h2>
    </div>
  </div>

  <div class="collections__grid">
    <!-- Atelier — portrait, row 1 left -->
    <div class="col-card col-card--elysian">
      <img src="images/atelier.png" alt="Atelier Series" class="col-card__img" draggable="false" loading="lazy" />
      <div class="col-card__overlay"></div>
      <div class="col-card__info">
        <div class="col-card__name">Atelier</div>
        <p class="col-card__desc">The rarest metals. The finest leathers. One standard.</p>
      </div>
     
    </div>

    <!-- Sovereign — portrait, row 1 right -->
    <div class="col-card col-card--sovereign">
      <img src="images/sovereign.png" alt="Sovereign Series" class="col-card__img" draggable="false" loading="lazy" />
      <div class="col-card__overlay"></div>
      <div class="col-card__info">
        <div class="col-card__name">Sovereign</div>
        <p class="col-card__desc">24K Gold, Platinum, Rose Gold. Crafted in precious metals.</p>
      </div>
      
    </div>

    <!-- Elysian — landscape, full width on row 2 -->
    <div class="col-card col-card--atelier col-card--wide">
      <img src="images/elysian.png" alt="Elysian Series" class="col-card__img" draggable="false" loading="lazy" />
      <div class="col-card__overlay"></div>
      <div class="col-card__info">
        <div class="col-card__name">Elysian</div>
        <p class="col-card__desc">Your colour. Your standard. A spectrum of refined hues designed to reflect every shade of you.</p>
      </div>
 
    </div>
  </div>
</section>
