<!--
  Outer wrapper: 400 vh — provides the scroll distance that drives the sequence.
  Inner stage:  position sticky — stays pinned at the top of the viewport while
                the wrapper scrolls beneath it.
-->
<div class="hs" #wrapper>
  <div class="hs__stage">

    <!-- ── Slides ──────────────────────────────────────────────────────────── -->
    @for (slide of slides; track slide.name; let i = $index) {
      <div class="hs__slide" #slideEl>

        <!-- Background image -->
        <picture class="hs__picture">
          <img
            [src]="slide.src"
            [alt]="slide.alt"
            class="hs__img"
            draggable="false"
            [attr.loading]="i === 0 ? 'eager' : 'lazy'"
            [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
          />
        </picture>

        <!-- Dark gradient vignette (top + bottom + left edge) -->
        <div class="hs__vignette" aria-hidden="true"></div>

        <!-- Film-grain texture -->
        <div class="hs__grain" aria-hidden="true"></div>

        <!-- Per-slide text content -->
        <div class="hs__content">

          <div class="hs__top"></div>

          <!-- Bottom row: large name + descriptor + counter -->
          <div class="hs__bottom">
            <div class="hs__text">
              <h2 class="hs__name" #nameEl>{{ slide.name }}</h2>
              <p class="hs__descriptor" #descEl>{{ slide.descriptor }}</p>
            </div>
            <div class="hs__count" aria-hidden="true">{{ slide.number }}</div>
          </div>

        </div>

      </div>
    }

    <!-- ── Prev / Next navigation ─────────────────────────────────────────── -->
    <div class="hs__nav-arrows" role="group" aria-label="Slide navigation">
      <button
        type="button"
        class="hs__arrow"
        (click)="prevSlide()"
        [attr.aria-disabled]="activeIndex() === 0"
        [attr.disabled]="activeIndex() === 0 ? '' : null"
        aria-label="Previous slide"
      >
        <svg width="12" height="7" viewBox="0 0 12 7" fill="none" aria-hidden="true">
          <path d="M1 6L6 1L11 6" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button
        type="button"
        class="hs__arrow"
        (click)="nextSlide()"
        [attr.aria-disabled]="activeIndex() === slides.length - 1"
        [attr.disabled]="activeIndex() === slides.length - 1 ? '' : null"
        aria-label="Next slide"
      >
        <svg width="12" height="7" viewBox="0 0 12 7" fill="none" aria-hidden="true">
          <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- ── Progress bar ───────────────────────────────────────────────────── -->
    <div class="hs__progress" aria-hidden="true">
      <div class="hs__progress-fill" #progressFill></div>
    </div>

    <!-- ── Scroll hint ─────────────────────────────────────────────────────── -->
    <div class="hs__scroll-hint" #scrollHint aria-hidden="true">
      <span class="hs__scroll-text">Scroll</span>
      <span class="hs__scroll-line"></span>
    </div>

  </div>
</div>
