<section #section class="hero" id="top">
  <div class="hero__grid">
    <div class="hero__copy">
      <span #eyebrow class="hero__eyebrow">Atelier · Est. MMXXV</span>

      <h1 #title class="hero__title">
        <span class="hero__line">Every surface,</span>
        <span class="hero__line">considered.</span>
      </h1>

      <p #sub class="hero__sub">
        A bespoke iPhone, finished by hand in limited commissions.
        Precious metals, hand-stitched leather, stone inlay —
        none of it mass produced.
      </p>

      <div class="hero__actions">
        <a href="#collection" class="btn btn--ink">Explore the collection</a>
        <a href="#atelier" class="btn btn--ghost">Inside the atelier</a>
      </div>
    </div>

    <figure #product class="hero__product">
      <div class="hero__phones">
        <picture class="hero__phone hero__phone--back">
          <source srcset="images/Image3.webp" type="image/webp">
          <img src="images/Image3.png" alt="KROHN iPhone" draggable="false">
        </picture>
        <picture class="hero__phone hero__phone--mid">
          <source srcset="images/Image2.webp" type="image/webp">
          <img src="images/Image2.png" alt="KROHN iPhone" draggable="false">
        </picture>
        <picture class="hero__phone hero__phone--front">
          <source srcset="images/Image1.webp" type="image/webp">
          <img src="images/Image1.png" alt="KROHN iPhone" draggable="false">
        </picture>
      </div>
    </figure>
  </div>

  <div class="hero__scroll-hint" aria-hidden="true">
    <span>Scroll</span>
    <span class="hero__scroll-line"></span>
  </div>
</section>
